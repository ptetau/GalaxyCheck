name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

env:
  MY_GET_FEED: https://www.myget.org/F/galaxy-check/api/v2/package
  MY_GET_TOKEN: ${{ secrets.MY_GET_API_KEY }}
  NUGET_FEED: https://api.nuget.org/v3/index.json
  NUGET_TOKEN: ${{ secrets.NUGET_API_KEY }}
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PACKABLE_PROJECTS: GalaxyCheck GalaxyCheck.Xunit GalaxyCheck.Xunit.CodeAnalysis GalaxyCheck.Xunit.V3 GalaxyCheck.TUnit GalaxyCheck.NUnit GalaxyCheck.MSTest GalaxyCheck.SourceGeneration

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: [net10.0, net11.0]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore dependencies
        run: dotnet restore GalaxyCheck.sln
      - name: Build
        run: dotnet build --no-restore GalaxyCheck.sln
      - name: Test
        run: dotnet test --no-build --verbosity normal --framework ${{ matrix.framework }} GalaxyCheck.sln

  slice-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Test
        run: dotnet test src/GalaxyCheck.Tests.Slice

  pack-prerelease:
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore
        run: |
          for project in $PACKABLE_PROJECTS; do
            dotnet restore src/$project/$project.csproj
          done
      - name: Build
        run: |
          for project in $PACKABLE_PROJECTS; do
            dotnet build --no-restore src/$project/$project.csproj
          done
      - name: Pack
        run: |
          mkdir ./nupkg-prerelease
          for project in $PACKABLE_PROJECTS; do
            dotnet pack \
              -v normal \
              -c Release \
              -o ./nupkg-prerelease \
              --no-restore \
              --include-symbols \
              --include-source \
              -p:PackageVersion=0.0.0-$GITHUB_RUN_ID \
              -p:SymbolPackageFormat=snupkg \
              src/$project/$project.csproj
          done
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-prerelease
          path: ./nupkg-prerelease

  prerelease:
    needs: pack-prerelease
    if: github.ref == 'refs/heads/main' && github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: nupkg-prerelease
          path: nupkg-prerelease
      - name: Push to MyGet
        if: env.MY_GET_TOKEN != ''
        run: |
          for f in ./nupkg-prerelease/*.nupkg
          do
            dotnet nuget push $f --api-key $MY_GET_TOKEN --source $MY_GET_FEED
          done

  pack-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore
        run: |
          for project in $PACKABLE_PROJECTS; do
            dotnet restore src/$project/$project.csproj
          done
      - name: Build
        run: |
          for project in $PACKABLE_PROJECTS; do
            dotnet build --no-restore src/$project/$project.csproj
          done
      - name: Pack
        run: |
          arrTag=(${GITHUB_REF//\// })
          VERSION="${arrTag[2]}"
          echo "Version: $VERSION"
          VERSION=$(echo $VERSION | sed -E 's/^v//g')
          echo "Clean Version: $VERSION"

          mkdir ./nupkg-release
          for project in $PACKABLE_PROJECTS; do
            dotnet pack \
              -v normal \
              -c Release \
              -o ./nupkg-release \
              --no-restore \
              --include-symbols \
              --include-source \
              -p:PackageVersion=$VERSION \
              -p:SymbolPackageFormat=snupkg \
              src/$project/$project.csproj
          done
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-release
          path: ./nupkg-release

  release:
    needs: pack-release
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: nupkg-release
          path: nupkg-release
      - name: Push to MyGet
        if: env.MY_GET_TOKEN != ''
        run: |
          for f in ./nupkg-release/*.nupkg
          do
            dotnet nuget push $f --api-key $MY_GET_TOKEN --source $MY_GET_FEED
          done
      - name: Push to Nuget
        if: env.NUGET_TOKEN != ''
        run: |
          for f in ./nupkg-release/*.nupkg
          do
            dotnet nuget push $f --api-key $NUGET_TOKEN --source $NUGET_FEED
          done
